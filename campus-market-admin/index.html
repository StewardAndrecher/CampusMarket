<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>CampusMarket 管理后台</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<style>
  body { margin: 0; background: #f0f2f5; }
  .login-wrap { height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-box { background: #fff; padding: 40px; border-radius: 8px; width: 360px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .stat-card { background: #fff; padding: 24px; border-radius: 8px; }
  .stat-num { font-size: 28px; font-weight: 700; color: #409eff; }
  .stat-label { color: #888; margin-top: 8px; }
  .layout { padding: 20px; }
</style>
</head>
<body>
<div id="app">
  <div v-if="!token" class="login-wrap">
    <div class="login-box">
      <h2 style="text-align:center">CampusMarket 管理后台</h2>
      <el-input v-model="loginForm.username" placeholder="管理员账号" style="margin-bottom:12px" />
      <el-input v-model="loginForm.password" type="password" placeholder="密码" @keyup.enter="doLogin" style="margin-bottom:20px" />
      <el-button type="primary" style="width:100%" @click="doLogin">登 录</el-button>
    </div>
  </div>

  <div v-else>
    <el-container style="min-height:100vh">
      <el-header style="background:#001529;color:#fff;display:flex;align-items:center">
        <span style="font-size:18px;font-weight:600">CampusMarket 管理后台</span>
        <el-button style="margin-left:auto" size="small" @click="logout">退出</el-button>
      </el-header>
      <el-container>
        <el-aside width="200px" style="background:#fff">
          <el-menu :default-active="active" @select="v => active = v">
            <el-menu-item index="dashboard">数据看板</el-menu-item>
            <el-menu-item index="users">用户管理</el-menu-item>
            <el-menu-item index="products">商品审核</el-menu-item>
            <el-menu-item index="orders">订单管理</el-menu-item>
          </el-menu>
        </el-aside>
        <el-main class="layout">
          <div v-if="active==='dashboard'">
            <div class="stats">
              <div class="stat-card"><div class="stat-num">{{ stats.userCount||0 }}</div><div class="stat-label">总用户</div></div>
              <div class="stat-card"><div class="stat-num">{{ stats.productCount||0 }}</div><div class="stat-label">总商品</div></div>
              <div class="stat-card"><div class="stat-num">{{ stats.orderCount||0 }}</div><div class="stat-label">总订单</div></div>
              <div class="stat-card"><div class="stat-num">¥{{ stats.totalAmount||0 }}</div><div class="stat-label">交易额</div></div>
            </div>
          </div>

          <div v-if="active==='users'">
            <el-table :data="users" border>
              <el-table-column prop="id" label="ID" width="60" />
              <el-table-column prop="username" label="账号" />
              <el-table-column prop="nickname" label="昵称" />
              <el-table-column prop="status" label="状态" width="80">
                <template #default="s">
                  <el-tag :type="s.row.status===1?'success':'danger'">{{ s.row.status===1?'正常':'禁用' }}</el-tag>
                </template>
              </el-table-column>
              <el-table-column label="操作" width="120">
                <template #default="s">
                  <el-button size="small" @click="toggleUser(s.row.id)">{{ s.row.status===1?'禁用':'启用' }}</el-button>
                </template>
              </el-table-column>
            </el-table>
          </div>

          <div v-if="active==='products'">
            <el-table :data="products" border>
              <el-table-column prop="id" label="ID" width="60" />
              <el-table-column prop="title" label="商品标题" />
              <el-table-column prop="price" label="价格" width="100" />
              <el-table-column prop="status" label="状态" width="100">
                <template #default="s">
                  <el-tag :type="s.row.status===1?'success':'warning'">{{ ['','在售','已售','下架','待审'][s.row.status]||s.row.status }}</el-tag>
                </template>
              </el-table-column>
              <el-table-column label="操作" width="160">
                <template #default="s">
                  <el-button size="small" type="success" @click="audit(s.row.id,1)">通过</el-button>
                  <el-button size="small" type="danger" @click="audit(s.row.id,0)">下架</el-button>
                </template>
              </el-table-column>
            </el-table>
          </div>

          <div v-if="active==='orders'">
            <el-table :data="orders" border>
              <el-table-column prop="id" label="ID" width="60" />
              <el-table-column prop="orderNo" label="订单号" />
              <el-table-column prop="productTitle" label="商品" />
              <el-table-column prop="price" label="金额" width="100" />
              <el-table-column prop="status" label="状态" width="100">
                <template #default="s">
                  <el-tag>{{ ['待付款','待交付','已完成','已取消'][s.row.status] }}</el-tag>
                </template>
              </el-table-column>
            </el-table>
          </div>
        </el-main>
      </el-container>
    </el-container>
  </div>
</div>

<script>
const { createApp, ref, onMounted } = Vue
const api = axios.create({ baseURL: 'http://localhost:8080/api' })
api.interceptors.request.use(cfg => {
  const t = localStorage.getItem('admin_token')
  if (t) cfg.headers.Authorization = 'Bearer ' + t
  return cfg
})
api.interceptors.response.use(r => {
  if (r.data.code === 200) return r.data.data
  alert(r.data.message || '请求失败')
  throw new Error(r.data.message)
}, e => {
  if (e.response && e.response.status === 403) alert('无管理员权限')
  if (e.response && e.response.status === 401) { localStorage.removeItem('admin_token'); location.reload() }
  return Promise.reject(e)
})

createApp({
  setup() {
    const token = ref(localStorage.getItem('admin_token') || '')
    const active = ref('dashboard')
    const loginForm = ref({ username: '', password: '' })
    const stats = ref({})
    const users = ref([])
    const products = ref([])
    const orders = ref([])

    async function doLogin() {
      const r = await api.post('/user/login', loginForm.value)
      localStorage.setItem('admin_token', r.token)
      token.value = r.token
      loadAll()
    }
    function logout() { localStorage.removeItem('admin_token'); token.value = '' }

    async function loadAll() {
      stats.value = await api.get('/admin/stats')
      users.value = (await api.get('/admin/users', { params: { page:1, size:100 } })).records
      products.value = (await api.get('/admin/products', { params: { page:1, size:100 } })).records
      orders.value = (await api.get('/admin/orders', { params: { page:1, size:100 } })).records
    }
    async function toggleUser(id) { await api.post(`/admin/users/${id}/toggle-status`); loadAll() }
    async function audit(id, s) { await api.post(`/admin/products/${id}/audit`, null, { params: { status: s } }); loadAll() }

    onMounted(() => { if (token.value) loadAll() })
    return { token, active, loginForm, stats, users, products, orders, doLogin, logout, toggleUser, audit }
  }
}).use(ElementPlus).mount('#app')
</script>
</body>
</html>
